<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Solo Anime</title>
    <title>Solo Animes</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#0f0f13">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">
        <article class="card">
            <header class="form-header">
                <h1 class="title">Criar <span>conta</span></h1>
                <p class="subtitle">Junte-se a nós para acessar seu espaço seguro</p>
            </header>

            <form class="form" action="home.html" method="GET">
                <div class="field">
                    <label for="signup-name">Nome completo</label>
                    <div class="input-wrap">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input id="signup-name" type="text" name="name" placeholder="Seu nome" required minlength="3">
                    </div>
                </div>

                <div class="field">
                    <label for="signup-email">Endereço de e-mail</label>
                    <div class="input-wrap">
                        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        <input id="signup-email" type="email" name="email" placeholder="voce@dominio.com" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="field half">
                        <label for="signup-pass">Senha</label>
                        <div class="input-wrap">
                            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input id="signup-pass" type="password" name="password" placeholder="••••••••" required minlength="6">
                        </div>
                    </div>
                    <div class="field half">
                        <label for="signup-pass2">Confirmar</label>
                        <div class="input-wrap">
                            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input id="signup-pass2" type="password" name="password_confirm" placeholder="••••••••" required minlength="6">
                        </div>
                    </div>
                </div>

                <label class="checkbox full">
                    <input type="checkbox" name="terms" required>
                    <span class="checkmark"></span>
                    <span>Concordo com os <a href="#" class="link">Termos</a> e a <a href="#" class="link">Política</a></span>
                </label>

                <button type="submit" class="btn-primary">
                    <span>Criar conta</span>
                    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>

                <p class="switch-text">
                    Já tem uma conta? <a href="login.html" class="switch-link">Entrar</a>
                </p>
            </form>
        </article>
    </main>

</body>
</html>
